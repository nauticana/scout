table: step_loop_entry
comment: Append-only journal of one model and tool loop step, replayed on redelivery and approval resume
columns:
  - name: tenant_id
    type: BIGINT
  - name: request_id
    type: VARCHAR(120)
  - name: execution_step_id
    type: BIGINT
  - name: entry_no
    type: INTEGER
  - name: entry_uri
    type: TEXT
  - name: entry_digest
    type: CHAR(64)
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [tenant_id, request_id, execution_step_id, entry_no]
foreign_keys:
  - name: step_loop_entries
    columns: [tenant_id, request_id, execution_step_id]
    references:
      table: step_idempotency
      columns: [tenant_id, request_id, execution_step_id]
checks:
  - name: step_loop_entry_no_ck
    expression: entry_no > 0
  - name: step_loop_entry_digest_ck
    expression: CHAR_LENGTH(entry_digest) = 64
