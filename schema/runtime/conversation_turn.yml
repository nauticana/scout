table: conversation_turn
comment: Durable request and response metadata for one conversation turn
columns:
  - name: partner_id
    type: BIGINT
  - name: conversation_id
    type: VARCHAR(120)
  - name: turn_no
    type: BIGINT
  - name: request_id
    type: VARCHAR(120)
  - name: status_code
    type: CHAR(1)
  - name: input_uri
    type: TEXT
  - name: input_digest
    type: CHAR(64)
  - name: response_uri
    type: TEXT
    nullable: true
  - name: response_digest
    type: CHAR(64)
    nullable: true
  - name: queued_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
  - name: started_at
    type: TIMESTAMP
    nullable: true
  - name: first_response_at
    type: TIMESTAMP
    nullable: true
  - name: completed_at
    type: TIMESTAMP
    nullable: true
  - name: cancel_requested_at
    type: TIMESTAMP
    nullable: true
  - name: cancel_reason
    type: VARCHAR(200)
    nullable: true
  - name: fence
    type: BIGINT
    default: "0"
  - name: hold_requested_at
    type: TIMESTAMP
    nullable: true
  - name: hold_reason
    type: VARCHAR(200)
    nullable: true
  - name: hold_code
    type: CHAR(1)
    nullable: true
  - name: held_at
    type: TIMESTAMP
    nullable: true
  - name: holder_kind
    type: VARCHAR(20)
    nullable: true
  - name: holder_id
    type: VARCHAR(120)
    nullable: true
    comment: The person who operates the turn, or who finished it
  - name: hold_until
    type: TIMESTAMP
    nullable: true
    comment: Store-clock end of the operator's lease; the sweeper holds a lapsed turn again
  - name: work_ref
    type: VARCHAR(200)
    nullable: true
    comment: The product work item the turn served; products own its meaning, which prevents a foreign key
  - name: working_set_code
    type: CHAR(1)
    nullable: true
    comment: Assurance of the turn's latest compiled working set; null when the runtime compiles none
primary_key: [partner_id, conversation_id, turn_no]
foreign_keys:
  - name: conversation_turns
    columns: [partner_id, conversation_id]
    references:
      table: agent_conversation
      columns: [partner_id, conversation_id]
  - name: status_conversation_turns
    columns: [status_code]
    references:
      table: turn_status
      columns: [code]
indexes:
  - name: conversation_turn_request_uq
    columns: [partner_id, request_id]
    unique: true
  - name: conversation_turn_status_ix
    columns: [status_code, queued_at]
  - name: conversation_turn_tenant_queued_ix
    columns: [partner_id, queued_at]
  - name: conversation_turn_hold_ix
    columns: [status_code, hold_until]
  - name: conversation_turn_work_ix
    columns: [partner_id, work_ref, queued_at]
    where: work_ref IS NOT NULL
checks:
  - name: conversation_turn_number_ck
    expression: turn_no > 0
  - name: conversation_turn_input_digest_ck
    expression: CHAR_LENGTH(input_digest) = 64
  - name: conversation_turn_response_ck
    expression: (response_uri IS NULL AND response_digest IS NULL) OR (response_uri IS NOT NULL AND response_digest IS NOT NULL)
  - name: conversation_turn_response_digest_ck
    expression: response_digest IS NULL OR CHAR_LENGTH(response_digest) = 64
  - name: conversation_turn_started_ck
    expression: started_at IS NULL OR started_at >= queued_at
  - name: conversation_turn_first_response_ck
    expression: first_response_at IS NULL OR (started_at IS NOT NULL AND first_response_at >= started_at)
  - name: conversation_turn_completed_ck
    expression: completed_at IS NULL OR (started_at IS NOT NULL AND completed_at >= started_at)
  - name: conversation_turn_fence_ck
    expression: fence >= 0
  - name: conversation_turn_hold_request_ck
    expression: (hold_requested_at IS NULL) = (hold_reason IS NULL)
  - name: conversation_turn_hold_code_ck
    expression: hold_code IN ('C', 'A', 'P', 'U', 'E')
  - name: conversation_turn_working_set_code_ck
    expression: working_set_code IN ('V', 'B', 'C', 'I', 'U')
  - name: conversation_turn_held_code_ck
    expression: (status_code IN ('H', 'O')) = (hold_code IS NOT NULL)
  - name: conversation_turn_held_at_ck
    expression: (status_code IN ('H', 'O')) = (held_at IS NOT NULL)
  - name: conversation_turn_holder_ck
    expression: (holder_kind IS NULL) = (holder_id IS NULL)
  - name: conversation_turn_operated_ck
    expression: (status_code <> 'O' OR holder_id IS NOT NULL) AND (holder_id IS NULL OR status_code IN ('O', 'C'))
  - name: conversation_turn_hold_until_ck
    expression: (status_code = 'O') = (hold_until IS NOT NULL)
