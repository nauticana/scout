table: conversation_turn
comment: Durable request and response metadata for one conversation turn
columns:
  - name: tenant_id
    type: BIGINT
  - name: conversation_id
    type: VARCHAR(120)
  - name: turn_no
    type: BIGINT
  - name: request_id
    type: VARCHAR(120)
  - name: status_code
    type: VARCHAR(30)
  - name: input_uri
    type: TEXT
  - name: input_digest
    type: CHAR(64)
  - name: response_uri
    type: TEXT
    nullable: true
  - name: response_digest
    type: CHAR(64)
    nullable: true
  - name: queued_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
  - name: started_at
    type: TIMESTAMP
    nullable: true
  - name: first_response_at
    type: TIMESTAMP
    nullable: true
  - name: completed_at
    type: TIMESTAMP
    nullable: true
primary_key: [tenant_id, conversation_id, turn_no]
foreign_keys:
  - name: conversation_turns
    columns: [tenant_id, conversation_id]
    references:
      table: agent_conversation
      columns: [tenant_id, conversation_id]
  - name: status_conversation_turns
    columns: [status_code]
    references:
      table: turn_status
      columns: [code]
indexes:
  - name: conversation_turn_request_uq
    columns: [tenant_id, request_id]
    unique: true
  - name: conversation_turn_status_ix
    columns: [status_code, queued_at]
checks:
  - name: conversation_turn_number_ck
    expression: turn_no > 0
  - name: conversation_turn_input_digest_ck
    expression: CHAR_LENGTH(input_digest) = 64
  - name: conversation_turn_response_ck
    expression: (response_uri IS NULL AND response_digest IS NULL) OR (response_uri IS NOT NULL AND response_digest IS NOT NULL)
  - name: conversation_turn_response_digest_ck
    expression: response_digest IS NULL OR CHAR_LENGTH(response_digest) = 64
  - name: conversation_turn_started_ck
    expression: started_at IS NULL OR started_at >= queued_at
  - name: conversation_turn_first_response_ck
    expression: first_response_at IS NULL OR (started_at IS NOT NULL AND first_response_at >= started_at)
  - name: conversation_turn_completed_ck
    expression: completed_at IS NULL OR (started_at IS NOT NULL AND completed_at >= started_at)
