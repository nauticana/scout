table: agent_conversation
comment: Tenant conversation pinned to an agent version
columns:
  - name: partner_id
    type: BIGINT
  - name: conversation_id
    type: VARCHAR(120)
  - name: agent_id
    type: VARCHAR(80)
  - name: agent_version
    type: VARCHAR(80)
  - name: end_user_ref
    type: VARCHAR(200)
    nullable: true
  - name: alias_id
    type: VARCHAR(80)
    nullable: true
    comment: The agent type alias the conversation was requested through
  - name: version_source
    type: VARCHAR(30)
    nullable: true
    comment: The rule that chose agent_version, such as stable, canary, or request_pin; null when the product supplied it
  - name: pin_reason
    type: VARCHAR(400)
    nullable: true
    comment: Why the caller pinned agent_version instead of taking the traffic policy
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
  - name: closed_at
    type: TIMESTAMP
    nullable: true
primary_key: [partner_id, conversation_id]
foreign_keys:
  - name: conversations
    columns: [partner_id]
    references:
      table: agent_tenant
      columns: [partner_id]
  - name: agent_version_conversations
    columns: [partner_id, agent_id, agent_version]
    references:
      table: agent_version
      columns: [partner_id, agent_id, agent_version]
  - name: alias_conversations
    columns: [partner_id, alias_id]
    references:
      table: agent_alias
      columns: [partner_id, alias_id]
indexes:
  - name: agent_conversation_created_ix
    columns: [partner_id, created_at]
  - name: agent_conversation_user_ix
    columns: [partner_id, end_user_ref, created_at]
    where: end_user_ref IS NOT NULL
checks:
  - name: agent_conversation_dates_ck
    expression: closed_at IS NULL OR closed_at >= created_at
