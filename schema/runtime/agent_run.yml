table: agent_run
comment: Settled execution, successful or not, attributed to an immutable agent release
columns:
  - name: id
    type: BIGINT
  - name: partner_id
    type: BIGINT
  - name: agent_id
    type: VARCHAR(80)
  - name: agent_version
    type: VARCHAR(80)
  - name: task_kind
    type: VARCHAR(80)
  - name: request_id
    type: VARCHAR(120)
    nullable: true
    comment: The durable turn's request id; null for an execution outside a turn
  - name: status_code
    type: VARCHAR(30)
  - name: completed_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [id]
sequence:
  name: agent_run_seq
  column: id
foreign_keys:
  - name: agent_run_versions
    columns: [partner_id, agent_id, agent_version]
    references:
      table: agent_version
      columns: [partner_id, agent_id, agent_version]
  - name: status_agent_runs
    columns: [status_code]
    references:
      table: turn_status
      columns: [code]
indexes:
  - name: agent_run_last_ix
    columns: [partner_id, agent_id, completed_at]
  - name: agent_run_retention_ix
    columns: [completed_at]
  - name: agent_run_request_ux
    columns: [partner_id, request_id]
    unique: true
  - name: agent_run_tenant_ix
    columns: [partner_id, id]
checks:
  - name: agent_run_task_kind_ck
    expression: CHAR_LENGTH(TRIM(task_kind)) > 0
  - name: agent_run_status_ck
    expression: status_code IN ('completed', 'failed', 'cancelled')
