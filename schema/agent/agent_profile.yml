table: agent_profile
comment: Tenant-owned agent identity and operational status
columns:
  - name: tenant_id
    type: BIGINT
  - name: agent_id
    type: VARCHAR(80)
  - name: agent_kind
    type: VARCHAR(80)
  - name: display_name
    type: VARCHAR(200)
  - name: is_active
    type: BOOLEAN
    default: TRUE
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [tenant_id, agent_id]
foreign_keys:
  - name: agent_profiles
    columns: [tenant_id]
    references:
      table: agent_tenant
      columns: [partner_id]
indexes:
  - name: agent_profile_kind_id_uq
    columns: [tenant_id, agent_kind, agent_id]
    unique: true
