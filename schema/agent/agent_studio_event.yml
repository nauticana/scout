table: agent_studio_event
comment: Queryable tenant agent lifecycle event
columns:
  - name: id
    type: BIGINT
  - name: partner_id
    type: BIGINT
  - name: agent_id
    type: VARCHAR(80)
  - name: event
    type: VARCHAR(40)
  - name: detail
    type: VARCHAR(400)
    nullable: true
  - name: principal_kind
    type: VARCHAR(20)
    nullable: true
  - name: principal_id
    type: VARCHAR(120)
    nullable: true
    comment: The acting person's user_account id or the service's id; a mixed subject prevents a foreign key
  - name: occurred_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [id]
sequence:
  name: agent_studio_event_seq
  column: id
foreign_keys:
  - name: agent_studio_events
    columns: [partner_id, agent_id]
    references:
      table: agent_profile
      columns: [partner_id, agent_id]
indexes:
  - name: agent_studio_event_agent_time_ix
    columns: [partner_id, agent_id, occurred_at]
checks:
  - name: agent_studio_event_principal_ck
    expression: (principal_kind IS NULL) = (principal_id IS NULL)
