table: safety_event
comment: One guardrail intervention, attributed to the principal, release, and policy version; never the inspected content
columns:
  - name: id
    type: BIGINT
  - name: partner_id
    type: BIGINT
  - name: principal_kind
    type: VARCHAR(20)
    nullable: true
  - name: principal_id
    type: VARCHAR(120)
    nullable: true
  - name: agent_id
    type: VARCHAR(80)
    nullable: true
    comment: The agent principal whose release was inspected
  - name: request_id
    type: VARCHAR(120)
    nullable: true
  - name: stage_code
    type: VARCHAR(30)
  - name: layer_code
    type: CHAR(1)
  - name: action_code
    type: VARCHAR(30)
  - name: severity_code
    type: VARCHAR(30)
  - name: rule_ids
    type: TEXT
  - name: release_version
    type: VARCHAR(80)
    nullable: true
  - name: policy_version
    type: VARCHAR(80)
    nullable: true
  - name: duration_ms
    type: BIGINT
    default: 0
  - name: occurred_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [id]
sequence:
  name: safety_event_seq
  column: id
foreign_keys:
  - name: safety_events
    columns: [partner_id]
    references:
      table: agent_tenant
      columns: [partner_id]
  - name: agent_safety_events
    columns: [partner_id, agent_id]
    references:
      table: agent_profile
      columns: [partner_id, agent_id]
indexes:
  - name: safety_event_tenant_time_ix
    columns: [partner_id, occurred_at]
  - name: safety_event_release_ix
    columns: [partner_id, release_version, severity_code]
  - name: safety_event_agent_ix
    columns: [partner_id, agent_id, id]
  - name: safety_event_agent_time_ix
    columns: [partner_id, agent_id, occurred_at]
checks:
  - name: safety_event_duration_ck
    expression: duration_ms >= 0
  - name: safety_event_layer_ck
    expression: layer_code IN ('B', 'P', 'T', 'Y', 'R')
  - name: safety_event_stage_ck
    expression: stage_code IN ('input', 'output', 'tool_input', 'tool_output', 'retrieval')
  - name: safety_event_action_ck
    expression: action_code IN ('block', 'redact', 'flag')
  - name: safety_event_severity_ck
    expression: severity_code IN ('hard', 'soft')
