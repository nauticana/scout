table: tool_credential_binding
comment: Reference binding one principal to a scoped identity for one tool; never secret material
columns:
  - name: tenant_id
    type: BIGINT
  - name: principal_kind
    type: VARCHAR(20)
  - name: principal_id
    type: VARCHAR(120)
  - name: tool_id
    type: VARCHAR(80)
  - name: purpose
    type: VARCHAR(80)
  - name: begda
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
  - name: endda
    type: TIMESTAMP
    nullable: true
  - name: credential_ref
    type: TEXT
  - name: delegated_from_user_id
    type: BIGINT
    nullable: true
  - name: grant_id
    type: VARCHAR(80)
    nullable: true
  - name: config_scopes
    type: TEXT
  - name: max_ttl_seconds
    type: INTEGER
    nullable: true
  - name: revoked_at
    type: TIMESTAMP
    nullable: true
primary_key: [tenant_id, principal_kind, principal_id, tool_id, purpose, begda]
foreign_keys:
  - name: tool_credential_bindings
    columns: [tenant_id, tool_id]
    references:
      table: tool_profile
      columns: [tenant_id, tool_id]
  - name: delegated_credential_bindings
    columns: [delegated_from_user_id]
    references:
      table: user_account
      columns: [id]
  - name: grant_credential_bindings
    columns: [tenant_id, grant_id]
    references:
      table: delegation_grant
      columns: [tenant_id, grant_id]
indexes:
  - name: credential_binding_principal_ix
    columns: [tenant_id, principal_kind, principal_id]
checks:
  - name: credential_binding_window_ck
    expression: endda IS NULL OR endda > begda
  - name: credential_binding_ttl_ck
    expression: max_ttl_seconds IS NULL OR max_ttl_seconds > 0
  - name: credential_binding_delegation_ck
    expression: (delegated_from_user_id IS NULL) = (grant_id IS NULL)
