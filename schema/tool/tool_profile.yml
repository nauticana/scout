table: tool_profile
comment: Tenant-owned tool identity
columns:
  - name: tenant_id
    type: BIGINT
  - name: tool_id
    type: VARCHAR(80)
  - name: display_name
    type: VARCHAR(200)
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [tenant_id, tool_id]
foreign_keys:
  - name: tool_profiles
    columns: [tenant_id]
    references:
      table: agent_tenant
      columns: [partner_id]
