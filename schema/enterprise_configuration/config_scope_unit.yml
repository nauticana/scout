table: config_scope_unit
comment: The configuration scope a Charter organization unit is attached to; a child unit's scope descends from its parent's
columns:
  - name: partner_id
    type: BIGINT
  - name: unit_id
    type: BIGINT
  - name: scope_id
    type: VARCHAR(80)
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [partner_id, unit_id]
foreign_keys:
  - name: organization_unit_config_scopes
    columns: [partner_id, unit_id]
    references:
      table: organization_unit
      columns: [partner_id, id]
  - name: unit_config_scopes
    columns: [partner_id, scope_id]
    references:
      table: config_scope
      columns: [partner_id, scope_id]
indexes:
  - name: config_scope_unit_scope_ix
    columns: [partner_id, scope_id]
