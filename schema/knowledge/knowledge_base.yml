table: knowledge_base
comment: Tenant-owned knowledge base identity
columns:
  - name: partner_id
    type: BIGINT
  - name: knowledge_base_id
    type: VARCHAR(80)
  - name: display_name
    type: VARCHAR(200)
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [partner_id, knowledge_base_id]
foreign_keys:
  - name: knowledge_bases
    columns: [partner_id]
    references:
      table: agent_tenant
      columns: [partner_id]
