table: tenant_ring_member
comment: Platform rollout cohort assigned to a tenant
columns:
  - name: partner_id
    type: BIGINT
  - name: ring_code
    type: VARCHAR(30)
primary_key: [partner_id]
foreign_keys:
  - name: tenant_ring_members
    columns: [partner_id]
    references:
      table: agent_tenant
      columns: [partner_id]
  - name: ring_members
    columns: [ring_code]
    references:
      table: tenant_ring
      columns: [ring_code]
