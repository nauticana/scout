table: contract_test_result
comment: Outcome of one compatibility assertion in a run
columns:
  - name: run_id
    type: BIGINT
  - name: tenant_id
    type: BIGINT
  - name: test_case_id
    type: VARCHAR(120)
  - name: passed
    type: BOOLEAN
  - name: failures
    type: TEXT
  - name: duration_ms
    type: INTEGER
primary_key: [run_id, tenant_id, test_case_id]
foreign_keys:
  - name: contract_test_results
    columns: [run_id]
    references:
      table: contract_test_run
      columns: [id]
  - name: case_test_results
    columns: [tenant_id, test_case_id]
    references:
      table: contract_test_case
      columns: [tenant_id, test_case_id]
indexes:
  - name: contract_test_result_case_ix
    columns: [tenant_id, test_case_id]
checks:
  - name: contract_test_result_duration_ck
    expression: duration_ms >= 0
