table: contract_test_case
comment: Compatibility assertion for a tenant agent version
columns:
  - name: tenant_id
    type: BIGINT
  - name: test_case_id
    type: VARCHAR(120)
  - name: agent_id
    type: VARCHAR(80)
  - name: agent_version
    type: VARCHAR(80)
  - name: input_uri
    type: TEXT
  - name: input_digest
    type: CHAR(64)
  - name: assertions
    type: TEXT
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [tenant_id, test_case_id]
foreign_keys:
  - name: contract_test_cases
    columns: [tenant_id, agent_id, agent_version]
    references:
      table: agent_version
      columns: [tenant_id, agent_id, agent_version]
checks:
  - name: contract_test_case_input_digest_ck
    expression: CHAR_LENGTH(input_digest) = 64
