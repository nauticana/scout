table: tenant_runtime_policy
comment: Immutable tenant execution and cost policy version
columns:
  - name: tenant_id
    type: BIGINT
  - name: policy_version
    type: VARCHAR(80)
  - name: priority_class_code
    type: VARCHAR(30)
  - name: capacity_class_code
    type: VARCHAR(30)
  - name: max_steps
    type: INTEGER
  - name: max_tokens
    type: BIGINT
  - name: max_cost_minor_units
    type: BIGINT
  - name: cost_currency_code
    type: CHAR(3)
  - name: turn_timeout_ms
    type: INTEGER
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [tenant_id, policy_version]
foreign_keys:
  - name: tenant_runtime_policies
    columns: [tenant_id]
    references:
      table: agent_tenant
      columns: [partner_id]
  - name: priority_runtime_policies
    columns: [priority_class_code]
    references:
      table: priority_class
      columns: [code]
  - name: currency_runtime_policies
    columns: [cost_currency_code]
    references:
      table: currency
      columns: [code]
indexes:
  - name: tenant_runtime_policy_created_ix
    columns: [tenant_id, created_at]
checks:
  - name: tenant_runtime_policy_steps_ck
    expression: max_steps > 0
  - name: tenant_runtime_policy_tokens_ck
    expression: max_tokens > 0
  - name: tenant_runtime_policy_cost_ck
    expression: max_cost_minor_units >= 0
  - name: tenant_runtime_policy_timeout_ck
    expression: turn_timeout_ms > 0
