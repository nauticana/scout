table: execution_transition
comment: Directed transition between execution graph nodes
columns:
  - name: source_step_id
    type: BIGINT
  - name: transition_key
    type: VARCHAR(120)
  - name: target_step_id
    type: BIGINT
  - name: condition_expression
    type: TEXT
    nullable: true
primary_key: [source_step_id, transition_key]
foreign_keys:
  - name: outgoing_execution_transitions
    columns: [source_step_id]
    references:
      table: execution_step
      columns: [id]
  - name: incoming_execution_transitions
    columns: [target_step_id]
    references:
      table: execution_step
      columns: [id]
indexes:
  - name: execution_transition_target_ix
    columns: [target_step_id]
checks:
  - name: execution_transition_self_ck
    expression: source_step_id <> target_step_id
