table: turn_approval_request
comment: One durable decision a human owes; proposed_digest binds the verdict to the exact action
columns:
  - name: id
    type: BIGINT
  - name: partner_id
    type: BIGINT
  - name: request_id
    type: VARCHAR(120)
  - name: conversation_id
    type: VARCHAR(120)
  - name: execution_step_id
    type: BIGINT
  - name: principal_kind
    type: VARCHAR(20)
  - name: principal_id
    type: VARCHAR(120)
  - name: approver_kind
    type: VARCHAR(20)
    nullable: true
  - name: approver_id
    type: VARCHAR(120)
    nullable: true
  - name: scope_id
    type: VARCHAR(80)
    nullable: true
  - name: rule_id
    type: VARCHAR(80)
    comment: The rule within its source that asked for the person
  - name: requested_action
    type: VARCHAR(120)
  - name: resource_ref
    type: VARCHAR(200)
  - name: output_class_code
    type: CHAR(1)
  - name: risk_tier_code
    type: VARCHAR(20)
  - name: summary
    type: VARCHAR(400)
  - name: evidence_uri
    type: TEXT
    nullable: true
  - name: evidence_digest
    type: CHAR(64)
    nullable: true
  - name: proposed_digest
    type: CHAR(64)
  - name: status_code
    type: CHAR(1)
    default: P
  - name: deadline_at
    type: TIMESTAMP
    nullable: true
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
  - name: resolved_at
    type: TIMESTAMP
    nullable: true
  - name: notification_event_id
    type: BIGINT
    nullable: true
    comment: The keel outbox event that notifies the first approver; null when notifications go another way
  - name: revises_step_id
    type: BIGINT
    nullable: true
    comment: The edited proposal of the same turn that this request revises; null for an original proposal
  - name: release_version
    type: VARCHAR(80)
    nullable: true
    comment: The agent release whose frozen approval routing routed the request; null for other principals
  - name: requester_kind
    type: VARCHAR(20)
    nullable: true
  - name: requester_id
    type: VARCHAR(120)
    nullable: true
    comment: The person the turn acts for, who may never approve the request
  - name: rule_source_code
    type: VARCHAR(20)
    comment: Why the call needs a person
  - name: approval_route_id
    type: VARCHAR(64)
    nullable: true
    comment: The frozen approval route the request is assigned under; null for a request routed by scope or a product router
  - name: approver_reference_kind
    type: VARCHAR(20)
    nullable: true
  - name: approver_reference
    type: VARCHAR(128)
    nullable: true
    comment: The role or position, by the product's opaque reference, deciding at the current step
  - name: route_step
    type: SMALLINT
    default: 0
    comment: The route's escalation step the current assignment is at; verdicts and reassignments are fenced on it
  - name: route_resolution
    type: VARCHAR(256)
    nullable: true
    comment: The product resolver's evidence reference for the assigned approver, never personal data beyond it
  - name: turn_settled_at
    type: TIMESTAMP
    nullable: true
    comment: When the turn parked on an expired request was failed or found no longer parked; null while that is owed
primary_key: [id]
sequence:
  name: turn_approval_request_seq
  column: id
foreign_keys:
  - name: notified_turn_approval_requests
    columns: [notification_event_id]
    references:
      table: outbox_event
      columns: [id]
  - name: revised_turn_approval_requests
    columns: [partner_id, request_id, revises_step_id]
    references:
      table: turn_approval_request
      columns: [partner_id, request_id, execution_step_id]
  - name: turn_approval_requests
    columns: [partner_id]
    references:
      table: agent_tenant
      columns: [partner_id]
  - name: scope_turn_approval_requests
    columns: [partner_id, scope_id]
    references:
      table: config_scope
      columns: [partner_id, scope_id]
  - name: status_turn_approval_requests
    columns: [status_code]
    references:
      table: approval_status
      columns: [code]
  - name: risk_turn_approval_requests
    columns: [risk_tier_code]
    references:
      table: approval_risk_tier
      columns: [code]
  - name: released_turn_approval_requests
    columns: [partner_id, principal_id, release_version]
    references:
      table: effective_agent_release
      columns: [partner_id, agent_id, agent_version]
indexes:
  - name: turn_approval_request_id_tenant_uq
    columns: [id, partner_id]
    unique: true
  - name: turn_approval_request_step_uq
    columns: [partner_id, request_id, execution_step_id]
    unique: true
  - name: turn_approval_request_pending_ix
    columns: [partner_id, status_code, deadline_at]
  - name: turn_approval_request_approver_ix
    columns: [partner_id, approver_kind, approver_id, status_code]
checks:
  - name: turn_approval_request_digest_ck
    expression: CHAR_LENGTH(proposed_digest) = 64
  - name: turn_approval_request_evidence_ck
    expression: (evidence_uri IS NULL AND evidence_digest IS NULL) OR (evidence_uri IS NOT NULL AND CHAR_LENGTH(evidence_digest) = 64)
  - name: turn_approval_request_approver_ck
    expression: (approver_kind IS NULL AND approver_id IS NULL) OR (approver_kind IS NOT NULL AND approver_id IS NOT NULL)
  - name: turn_approval_request_revises_ck
    expression: revises_step_id IS NULL OR revises_step_id <> execution_step_id
  - name: turn_approval_request_release_ck
    expression: release_version IS NULL OR principal_kind = 'agent'
  - name: turn_approval_request_requester_ck
    expression: (requester_kind IS NULL AND requester_id IS NULL) OR (requester_kind IS NOT NULL AND requester_id IS NOT NULL)
  - name: turn_approval_request_step_ck
    expression: route_step BETWEEN 0 AND 3
  - name: turn_approval_request_rule_source_ck
    expression: rule_source_code IN ('autonomy', 'policy', 'guardrail')
  - name: turn_approval_request_approver_kind_ck
    expression: approver_reference_kind IS NULL OR approver_reference_kind IN ('role', 'position')
  - name: turn_approval_request_output_class_ck
    expression: output_class_code IN ('A', 'D', 'R', 'C')
  - name: turn_approval_request_route_ck
    expression: (approval_route_id IS NULL AND approver_reference_kind IS NULL AND approver_reference IS NULL AND route_resolution IS NULL AND route_step = 0) OR (approval_route_id IS NOT NULL AND approver_reference_kind IS NOT NULL AND approver_reference IS NOT NULL AND release_version IS NOT NULL)
  - name: turn_approval_request_settled_ck
    expression: turn_settled_at IS NULL OR status_code = 'T'
  - name: turn_approval_request_resolved_ck
    expression: (status_code IN ('P', 'S') AND resolved_at IS NULL) OR (status_code NOT IN ('P', 'S') AND resolved_at IS NOT NULL)
