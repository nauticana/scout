table: skill_example
comment: A request that should select the skill; seeds its selection eval
columns:
  - name: tenant_id
    type: BIGINT
  - name: skill_id
    type: VARCHAR(80)
  - name: skill_version
    type: VARCHAR(80)
  - name: example_no
    type: INTEGER
  - name: request
    type: TEXT
primary_key: [tenant_id, skill_id, skill_version, example_no]
foreign_keys:
  - name: skill_version_examples
    columns: [tenant_id, skill_id, skill_version]
    references:
      table: skill_version
      columns: [tenant_id, skill_id, skill_version]
checks:
  - name: skill_example_no_ck
    expression: example_no > 0
