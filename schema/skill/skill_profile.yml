table: skill_profile
comment: Tenant-owned skill identity
columns:
  - name: tenant_id
    type: BIGINT
  - name: skill_id
    type: VARCHAR(80)
  - name: display_name
    type: VARCHAR(200)
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [tenant_id, skill_id]
foreign_keys:
  - name: skill_profiles
    columns: [tenant_id]
    references:
      table: agent_tenant
      columns: [partner_id]
