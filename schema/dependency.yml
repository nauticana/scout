# Scout schema modules. A downstream selects only the modules its product needs:
# pass their directories to schemagen -input, and the matching seed directories
# to -seed. depends_on lists direct table-FK dependencies and fixes DDL order;
# seed_depends_on names components whose tables receive this module's seed rows.
# Currency columns reference keel geo's currency. tenancy additionally requires
# keel tenant_management (which depends on keel core and geo), approval keel
# outbox, and mcp_confirmation keel approval and outbox; mcp_confirmation links a
# confirmation to the runtime tool call that waits on it, so it requires runtime.
version: 1
groups:
  - name: catalog
    path: catalog
    seed: seed/catalog/catalog.yml
    depends_on: []
    seed_depends_on: [core]

  - name: tenancy
    path: tenancy
    seed: seed/tenancy/tenancy.yml
    depends_on: [catalog]
    seed_depends_on: [core]

  - name: prompt
    path: prompt
    seed: seed/prompt/prompt.yml
    depends_on: []
    seed_depends_on: [core]

  - name: model
    path: model
    seed: seed/model/model.yml
    depends_on: [catalog, tenancy]
    seed_depends_on: [core]

  - name: agent
    path: agent
    seed: seed/agent/agent.yml
    depends_on: [catalog, tenancy, prompt, model]
    seed_depends_on: [core]

  - name: tool
    path: tool
    depends_on: [tenancy, agent, agent_authorization]

  - name: execution_graph
    path: execution_graph
    seed: seed/execution_graph/execution_graph.yml
    depends_on: [agent]
    seed_depends_on: [core]

  - name: knowledge
    path: knowledge
    seed: seed/knowledge/knowledge.yml
    depends_on: [tenancy, agent]
    seed_depends_on: [core]

  - name: knowledge_vector
    path: knowledge_vector
    depends_on: [knowledge]

  - name: runtime
    path: runtime
    seed: seed/runtime/runtime.yml
    depends_on: [catalog, tenancy, model, agent, execution_graph, agent_authorization, configuration, tool]
    seed_depends_on: [core]

  - name: release
    path: release
    seed: seed/release/release.yml
    depends_on: [catalog, tenancy, agent, runtime]
    seed_depends_on: [core]

  - name: evaluation
    path: evaluation
    seed: seed/evaluation/evaluation.yml
    depends_on: [catalog, tenancy, model, agent, knowledge, release, runtime]
    seed_depends_on: [core]

  - name: skill
    path: skill
    depends_on: [tenancy, agent, tool]

  - name: configuration
    path: configuration
    seed: seed/configuration/configuration.yml
    depends_on: [catalog, tenancy, agent]
    seed_depends_on: [core]

  - name: agent_authorization
    path: agent_authorization
    seed: seed/agent_authorization/agent_authorization.yml
    depends_on: [catalog, agent]
    seed_depends_on: [core]

  - name: approval
    path: approval
    seed: seed/approval/approval.yml
    depends_on: [catalog, tenancy, agent, configuration, agent_authorization]
    seed_depends_on: [core]

  - name: memory
    path: memory
    depends_on: [tenancy]

  - name: mcp_confirmation
    path: mcp_confirmation
    seed: seed/mcp_confirmation/mcp_confirmation.yml
    depends_on: [catalog, tenancy, runtime]
    seed_depends_on: [core]
