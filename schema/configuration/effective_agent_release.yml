table: effective_agent_release
comment: Immutable configuration compiled for one agent version; payload carries every effective resource with its provenance
columns:
  - name: tenant_id
    type: BIGINT
  - name: agent_id
    type: VARCHAR(80)
  - name: agent_version
    type: VARCHAR(80)
  - name: scope_id
    type: VARCHAR(80)
  - name: payload
    type: TEXT
  - name: payload_digest
    type: CHAR(64)
  - name: compiled_by
    type: BIGINT
    nullable: true
  - name: compiled_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [tenant_id, agent_id, agent_version]
foreign_keys:
  - name: effective_agent_releases
    columns: [tenant_id, agent_id, agent_version]
    references:
      table: agent_version
      columns: [tenant_id, agent_id, agent_version]
  - name: scope_effective_agent_releases
    columns: [tenant_id, scope_id]
    references:
      table: config_scope
      columns: [tenant_id, scope_id]
  - name: compiled_effective_agent_releases
    columns: [compiled_by]
    references:
      table: user_account
      columns: [id]
checks:
  - name: effective_agent_release_digest_ck
    expression: CHAR_LENGTH(payload_digest) = 64
