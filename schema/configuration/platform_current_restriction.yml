table: platform_current_restriction
comment: The platform restriction layer in force; one row, swapped by compare-and-swap
columns:
  - name: singleton
    type: BOOLEAN
    default: TRUE
  - name: layer_digest
    type: CHAR(64)
  - name: updated_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [singleton]
foreign_keys:
  - name: platform_current_restrictions
    columns: [layer_digest]
    references:
      table: platform_restriction_layer
      columns: [layer_digest]
checks:
  - name: platform_current_restriction_singleton_ck
    expression: singleton
