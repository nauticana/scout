table: tenant_restriction_layer
comment: Immutable tenant-wide prohibitions applied on top of every release at decision time
columns:
  - name: tenant_id
    type: BIGINT
  - name: layer_digest
    type: CHAR(64)
  - name: denials
    type: TEXT
    comment: JSON list of deny policy statements
  - name: guardrail_rules
    type: TEXT
    comment: JSON guardrail rule envelope of block and redact rules
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [tenant_id, layer_digest]
foreign_keys:
  - name: tenant_restriction_layers
    columns: [tenant_id]
    references:
      table: agent_tenant
      columns: [partner_id]
checks:
  - name: tenant_restriction_layer_digest_ck
    expression: CHAR_LENGTH(layer_digest) = 64
