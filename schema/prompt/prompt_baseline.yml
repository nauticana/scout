table: prompt_baseline
comment: Product-supplied platform prompt baseline selected through an extension port
columns:
  - name: baseline_key
    type: VARCHAR(80)
  - name: agent_kind
    type: VARCHAR(80)
  - name: prompt_section_id
    type: BIGINT
  - name: language_code
    type: VARCHAR(16)
  - name: instruction
    type: TEXT
  - name: output
    type: TEXT
    nullable: true
primary_key: [baseline_key, agent_kind, prompt_section_id, language_code]
foreign_keys:
  - name: prompt_baselines
    columns: [prompt_section_id]
    references:
      table: prompt_section
      columns: [id]
checks:
  - name: prompt_baseline_instruction_ck
    expression: CHAR_LENGTH(instruction) BETWEEN 1 AND 16000
  - name: prompt_baseline_output_ck
    expression: output IS NULL OR CHAR_LENGTH(output) <= 16000
