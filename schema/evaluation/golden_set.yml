table: golden_set
comment: Named evaluation example collection owned by a tenant
columns:
  - name: partner_id
    type: BIGINT
  - name: golden_set_id
    type: VARCHAR(80)
  - name: name
    type: VARCHAR(200)
  - name: description
    type: VARCHAR(400)
    nullable: true
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [partner_id, golden_set_id]
foreign_keys:
  - name: golden_sets
    columns: [partner_id]
    references:
      table: agent_tenant
      columns: [partner_id]
