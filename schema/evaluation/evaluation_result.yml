table: evaluation_result
comment: Every score one arm earned on one example in a run
columns:
  - name: run_id
    type: BIGINT
  - name: partner_id
    type: BIGINT
  - name: golden_set_id
    type: VARCHAR(80)
  - name: set_version
    type: BIGINT
  - name: example_id
    type: VARCHAR(120)
  - name: role_code
    type: CHAR(1)
  - name: scores
    type: TEXT
  - name: latency_ms
    type: INTEGER
  - name: input_tokens
    type: BIGINT
    default: 0
  - name: output_tokens
    type: BIGINT
    default: 0
  - name: cost_minor_units
    type: BIGINT
    default: 0
  - name: evaluator_input_tokens
    type: BIGINT
    default: 0
  - name: evaluator_output_tokens
    type: BIGINT
    default: 0
  - name: evaluator_cost_minor_units
    type: BIGINT
    default: 0
    comment: What model-based evaluators spent scoring the result, in currency_code; the run's totals include it
  - name: currency_code
    type: CHAR(3)
    nullable: true
  - name: needs_human_review
    type: BOOLEAN
    default: FALSE
  - name: reason
    type: VARCHAR(400)
    nullable: true
  - name: output_uri
    type: VARCHAR(500)
    nullable: true
  - name: output_digest
    type: CHAR(64)
    nullable: true
    comment: With output_uri, the stored answer of a comparison arm
  - name: trajectory_uri
    type: VARCHAR(500)
    nullable: true
  - name: trajectory_digest
    type: CHAR(64)
    nullable: true
    comment: With trajectory_uri, the stored trajectory of the executed case; null when it produced none
primary_key: [run_id, example_id, role_code]
foreign_keys:
  - name: evaluation_results
    columns: [partner_id, run_id]
    references:
      table: evaluation_run
      columns: [partner_id, id]
  - name: example_evaluation_results
    columns: [partner_id, golden_set_id, set_version, example_id]
    references:
      table: golden_example
      columns: [partner_id, golden_set_id, set_version, example_id]
  - name: currency_evaluation_results
    columns: [currency_code]
    references:
      table: currency
      columns: [code]
indexes:
  - name: evaluation_result_example_ix
    columns: [partner_id, golden_set_id, set_version, example_id]
checks:
  - name: evaluation_result_role_ck
    expression: role_code IN ('B', 'C')
  - name: evaluation_result_usage_ck
    expression: latency_ms >= 0 AND input_tokens >= 0 AND output_tokens >= 0 AND cost_minor_units >= 0 AND evaluator_input_tokens >= 0 AND evaluator_output_tokens >= 0 AND evaluator_cost_minor_units >= 0
  - name: evaluation_result_currency_ck
    expression: (cost_minor_units = 0 AND evaluator_cost_minor_units = 0) OR currency_code IS NOT NULL
  - name: evaluation_result_output_ck
    expression: (output_uri IS NULL) = (output_digest IS NULL) AND (output_digest IS NULL OR CHAR_LENGTH(output_digest) = 64)
  - name: evaluation_result_trajectory_ck
    expression: (trajectory_uri IS NULL) = (trajectory_digest IS NULL) AND (trajectory_digest IS NULL OR CHAR_LENGTH(trajectory_digest) = 64)
