table: evaluation_run
comment: One execution of an evaluation manifest, or one queued agent evaluation of a golden set version
columns:
  - name: id
    type: BIGINT
  - name: partner_id
    type: BIGINT
  - name: manifest_id
    type: CHAR(64)
    nullable: true
  - name: agent_id
    type: VARCHAR(80)
    nullable: true
  - name: golden_set_id
    type: VARCHAR(80)
    nullable: true
  - name: set_version
    type: BIGINT
    nullable: true
  - name: scope_code
    type: VARCHAR(10)
  - name: status_code
    type: CHAR(1)
  - name: queued_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
  - name: started_at
    type: TIMESTAMP
    nullable: true
    default: CURRENT_TIMESTAMP
  - name: completed_at
    type: TIMESTAMP
    nullable: true
  - name: requested_by_kind
    type: VARCHAR(20)
    nullable: true
  - name: requested_by_id
    type: VARCHAR(120)
    nullable: true
    comment: The requesting person's user_account id or the service's id; a mixed subject prevents a foreign key
  - name: lease_token
    type: BIGINT
    nullable: true
  - name: lease_until
    type: TIMESTAMP
    nullable: true
  - name: attempt
    type: INTEGER
    default: 0
  - name: sample_count
    type: INTEGER
    default: 0
  - name: input_tokens
    type: BIGINT
    default: 0
  - name: output_tokens
    type: BIGINT
    default: 0
  - name: cost_minor_units
    type: BIGINT
    default: 0
  - name: currency_code
    type: CHAR(3)
    nullable: true
  - name: reason
    type: VARCHAR(400)
    nullable: true
primary_key: [id]
sequence:
  name: evaluation_run_seq
  column: id
foreign_keys:
  - name: evaluation_runs
    columns: [partner_id, manifest_id]
    references:
      table: evaluation_manifest
      columns: [partner_id, manifest_id]
  - name: agent_evaluation_runs
    columns: [partner_id, agent_id]
    references:
      table: agent_profile
      columns: [partner_id, agent_id]
  - name: golden_set_version_evaluation_runs
    columns: [partner_id, golden_set_id, set_version]
    references:
      table: golden_set_version
      columns: [partner_id, golden_set_id, set_version]
  - name: currency_evaluation_runs
    columns: [currency_code]
    references:
      table: currency
      columns: [code]
indexes:
  - name: evaluation_run_partner_uq
    columns: [partner_id, id]
    unique: true
  - name: evaluation_run_manifest_ix
    columns: [partner_id, manifest_id, started_at]
  - name: evaluation_run_agent_ix
    columns: [partner_id, agent_id, status_code]
  - name: evaluation_run_queue_ix
    columns: [status_code, id]
checks:
  - name: evaluation_run_scope_ck
    expression: scope_code IN ('dev', 'gate')
  - name: evaluation_run_status_ck
    expression: status_code IN ('Q', 'R', 'C', 'S', 'F')
  - name: evaluation_run_subject_ck
    expression: manifest_id IS NOT NULL OR (agent_id IS NOT NULL AND golden_set_id IS NOT NULL AND set_version IS NOT NULL)
  - name: evaluation_run_started_ck
    expression: status_code = 'Q' OR started_at IS NOT NULL
  - name: evaluation_run_dates_ck
    expression: completed_at IS NULL OR completed_at >= started_at
  - name: evaluation_run_requester_ck
    expression: (requested_by_kind IS NULL) = (requested_by_id IS NULL)
  - name: evaluation_run_lease_ck
    expression: (lease_token IS NULL) = (lease_until IS NULL) AND attempt >= 0
  - name: evaluation_run_usage_ck
    expression: sample_count >= 0 AND input_tokens >= 0 AND output_tokens >= 0 AND cost_minor_units >= 0
  - name: evaluation_run_currency_ck
    expression: cost_minor_units = 0 OR currency_code IS NOT NULL
