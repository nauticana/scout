table: golden_case_evidence
comment: One evidence or controlling-authority id a golden case's decision needs to reach the model
columns:
  - name: partner_id
    type: BIGINT
  - name: golden_set_id
    type: VARCHAR(80)
  - name: case_id
    type: VARCHAR(120)
  - name: role_code
    type: CHAR(1)
  - name: evidence_id
    type: VARCHAR(200)
    comment: A knowledge document, chunk, or resource id; it may name content another system holds, so no foreign key
primary_key: [partner_id, golden_set_id, case_id, role_code, evidence_id]
foreign_keys:
  - name: golden_case_evidence_ids
    columns: [partner_id, golden_set_id, case_id]
    references:
      table: golden_case
      columns: [partner_id, golden_set_id, case_id]
checks:
  - name: golden_case_evidence_role_ck
    expression: role_code IN ('E', 'A')
