comment: Runtime code lists, REST lookup metadata for runtime activity relations, and the conversation authorization object
order: 40
seeds:
  - table: constant_header
    columns: [id, caption]
    rows:
      - [turn_queue_status, Turn Queue Status]
      - [agent_run_status, Agent Run Status]
      - [turn_hold_code, Turn Hold Reason]
      - [turn_call_outcome_status, Tool Call Outcome Status]
      - [turn_call_resolution, Tool Call Resolution Source]
      - [turn_call_origin, Tool Call Origin]
      - [turn_call_attested, Attested Tool Call Outcome]
      - [turn_operator_entry_kind, Operator Entry Kind]
      - [working_set_assurance, Working Set Assurance]
  - table: constant_value
    columns: [constant_id, value, caption]
    rows:
      - [turn_hold_code, C, Held at a checkpoint on request]
      - [turn_hold_code, A, Held because its agent was suspended]
      - [turn_hold_code, P, Held at once by an operator]
      - [turn_hold_code, U, Held on a call whose outcome is unknown]
      - [turn_hold_code, E, Held on conflicted or insufficient evidence]
      - [working_set_assurance, V, Verified]
      - [working_set_assurance, B, Bounded]
      - [working_set_assurance, C, Conflicted]
      - [working_set_assurance, I, Insufficient Evidence]
      - [working_set_assurance, U, Unverified]
      - [turn_call_outcome_status, I, In Flight]
      - [turn_call_outcome_status, A, Accepted]
      - [turn_call_outcome_status, C, Completed]
      - [turn_call_outcome_status, F, Failed]
      - [turn_call_outcome_status, U, Unknown]
      - [turn_call_resolution, G, Gateway]
      - [turn_call_resolution, W, Late Worker Report]
      - [turn_call_resolution, E, Effect Observation]
      - [turn_call_resolution, L, Outcome Lookup]
      - [turn_call_resolution, T, Operator Attestation]
      - [turn_call_resolution, M, MCP Confirmation]
      - [turn_call_origin, A, Agent]
      - [turn_call_origin, O, Operator]
      - [turn_call_attested, C, Completed]
      - [turn_call_attested, F, Failed]
      - [turn_operator_entry_kind, N, Note]
      - [turn_operator_entry_kind, T, Tool Call]
      - [turn_operator_entry_kind, Y, Reply]
      - [turn_operator_entry_kind, W, Withdrawal]
      - [turn_operator_entry_kind, H, Handback Instruction]
      - [turn_queue_status, Q, Queued]
      - [turn_queue_status, L, Leased]
      - [turn_queue_status, A, Acknowledged]
      - [turn_queue_status, D, Dead]
      - [agent_run_status, C, Completed]
      - [agent_run_status, F, Failed]
      - [agent_run_status, X, Cancelled]
  - table: constant_lookup
    columns: [constant_id, table_name, column_name]
    rows:
      - [turn_queue_status, turn_queue, status_code]
      - [agent_run_status, agent_run, status_code]
      - [turn_hold_code, conversation_turn, hold_code]
      - [turn_call_outcome_status, turn_call_outcome, status_code]
      - [turn_call_resolution, turn_call_outcome, resolution_code]
      - [turn_call_origin, turn_call_outcome, origin_code]
      - [turn_call_attested, turn_call_attestation, outcome_code]
      - [turn_operator_entry_kind, turn_operator_entry, kind_code]
      - [working_set_assurance, conversation_turn, working_set_code]
  - table: foreign_key_lookup
    columns: [constraint_name, lookup_style, display_column]
    rows:
      - [agent_run_versions, S, "*"]
      - [tenant_agent_ops_events, S, "*"]
  - table: authorization_object
    columns: [id, caption]
    rows:
      - [AGENT_CONVERSATION, Agent conversations]
      - [AGENT_OPERATION, Live agent turn operation]
  - table: authorization_object_action
    columns: [authorization_object_id, action, caption]
    rows:
      - [AGENT_CONVERSATION, USE, Converse with an agent]
      - [AGENT_CONVERSATION, PIN_RELEASE, Pin a conversation to one agent release]
      - [AGENT_OPERATION, VIEW, View an agent's live turns and open call outcomes]
      - [AGENT_OPERATION, OPERATE, Hold and take over an agent's live turns]
      - [AGENT_OPERATION, PREEMPT, Hold a running turn at once]
      - [AGENT_OPERATION, RECONCILE, Attest an unknown tool call outcome]
  - table: authorization_role_permission
    columns: [role_id, authorization_object_id, action, low_limit]
    rows:
      - [AGENT_ADMIN, AGENT_CONVERSATION, USE, "*"]
      - [AGENT_ADMIN, AGENT_CONVERSATION, PIN_RELEASE, "*"]
      - [AGENT_OPER, AGENT_CONVERSATION, USE, "*"]
      - [AGENT_ADMIN, AGENT_OPERATION, VIEW, "*"]
      - [AGENT_ADMIN, AGENT_OPERATION, OPERATE, "*"]
      - [AGENT_ADMIN, AGENT_OPERATION, PREEMPT, "*"]
      - [AGENT_ADMIN, AGENT_OPERATION, RECONCILE, "*"]
      - [AGENT_OPER, AGENT_OPERATION, VIEW, "*"]
      - [AGENT_OPER, AGENT_OPERATION, OPERATE, "*"]
  - table: column_display_attribute
    columns: [table_name, column_name, currency_path]
    rows:
      - [budget_reservation, granted_cost_minor_units, currency_code]
      - [budget_reservation, settled_cost_minor_units, currency_code]
      - [conversation_turn_detail, staged_cost_minor_units, staged_currency_code]
      - [step_checkpoint, cost_minor_units, currency_code]
      - [usage_event, cost_minor_units, currency_code]
      - [turn_operator_entry, cost_minor_units, currency_code]
      - [agent_work_item, budget_minor_units, currency_code]
