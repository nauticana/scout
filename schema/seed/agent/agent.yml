      - [agent_evaluation_page_size, int, true, "50", "Evaluation results one Studio page returns when the caller names no limit (0..agent_evaluation_max_page_size); 0 uses Scout's default of 50"]
      - [agent_evaluation_max_page_size, int, true, "200", "Largest evaluation result page a Studio caller may ask for; 0 uses Scout's default of 200"]
