comment: Agent Studio config flags, authorization, menu, and REST metadata
order: 25
seeds:
  - table: constant_header
    columns: [id, caption]
    rows:
      - [guardrail_stage, Guardrail Stage]
      - [guardrail_layer, Guardrail Layer]
      - [guardrail_action, Guardrail Action]
      - [guardrail_severity, Guardrail Severity]
      - [publish_review_status, Publish Review Status]
      - [draft_comment_anchor, Draft Comment Anchor]
      - [draft_comment_status, Draft Comment Status]
  - table: constant_value
    columns: [constant_id, value, caption]
    rows:
      - [guardrail_stage, input, Turn Input]
      - [guardrail_stage, output, Model Output]
      - [guardrail_stage, tool_input, Tool Arguments]
      - [guardrail_stage, tool_output, Tool Result]
      - [guardrail_stage, retrieval, Retrieved Content]
      - [guardrail_layer, baseline, Release-Independent Baseline]
      - [guardrail_layer, platform, Platform Restriction]
      - [guardrail_layer, tenant, Tenant Restriction]
      - [guardrail_layer, type, Agent Type]
      - [guardrail_layer, release, Release-Specific Policy]
      - [guardrail_action, block, Blocked]
      - [guardrail_action, redact, Redacted]
      - [guardrail_action, flag, Flagged]
      - [guardrail_severity, hard, Hard]
      - [guardrail_severity, soft, Soft]
      - [publish_review_status, requested, Requested]
      - [publish_review_status, approved, Approved]
      - [publish_review_status, rejected, Rejected]
      - [publish_review_status, superseded, Superseded]
      - [draft_comment_anchor, draft, Whole Draft]
      - [draft_comment_anchor, prompt_section, Prompt Section]
      - [draft_comment_anchor, setting, Setting]
      - [draft_comment_status, open, Open]
      - [draft_comment_status, resolved, Resolved]
  - table: constant_lookup
    columns: [constant_id, table_name, column_name]
    rows:
      - [guardrail_stage, safety_event, stage_code]
      - [guardrail_layer, safety_event, layer_code]
      - [guardrail_action, safety_event, action_code]
      - [guardrail_severity, safety_event, severity_code]
      - [publish_review_status, agent_publish_review, status_code]
      - [draft_comment_anchor, agent_draft_comment, anchor_code]
      - [draft_comment_status, agent_draft_comment, status_code]
  - table: application_config_flag
    columns: [id, data_type, needs_restart, default_value, description]
    rows:
      - [agent_max_tokens, int, false, "8192", Max output tokens per agent model completion]
      - [agent_temperature, float, false, "", "Sampling temperature 0.0-2.0 sent to models with the sampling capability; empty sends none"]
      - [agent_run_retention_days, int, false, "0", "Days to retain agent run activity; 0 retains it forever"]
      - [agent_turn_rate, float, false, "2", Per-tenant admitted turns per second]
      - [agent_turn_burst, int, false, "10", Per-tenant turn burst]
      - [agent_tool_rate, float, false, "10", Per-tenant tool calls per second]
      - [agent_tool_burst, int, false, "20", Per-tenant tool-call burst]
      - [agent_model_rate, float, false, "2", Per-tenant model calls per second]
      - [agent_model_burst, int, false, "5", Per-tenant model-call burst]
      - [agent_fleet_turn_rate, float, false, "100", Process-wide admitted turns per second]
      - [agent_fleet_turn_burst, int, false, "200", Process-wide turn burst]
      - [agent_fleet_tool_rate, float, false, "500", Process-wide tool calls per second]
      - [agent_fleet_tool_burst, int, false, "1000", Process-wide tool-call burst]
      - [agent_fleet_model_rate, float, false, "100", Process-wide model calls per second]
      - [agent_fleet_model_burst, int, false, "200", Process-wide model-call burst]
      - [agent_max_tenants, int, false, "4096", Maximum in-memory tenant limiter entries]
      - [agent_model_capacity_pool, string, false, shared, Shared model capacity pool name]
      - [agent_model_capacity, int, false, "32", Concurrent model capacity slots]
      - [agent_model_max_waiters, int, false, "4096", Maximum queued model requests]
      - [agent_max_scope_depth, int, false, "8", Maximum scope-chain depth a release may compile over]
      - [agent_max_delegation_hops, int, false, "4", Maximum delegation hops in an authority chain]
      - [agent_approval_deadline, int, false, "3600", Seconds a reviewer has before escalation; 0 leaves a request open]
      - [agent_credential_ttl, int, false, "300", Default lifetime in seconds of a just-in-time tool credential]
      - [agent_audit_page_size, int, false, "100", Decision records returned per audit query page]
      - [agent_loop_max_iterations, int, false, "12", "Model decisions one tool loop step may make"]
      - [agent_loop_max_tool_calls, int, false, "24", "Governed tool calls one tool loop step may make"]
      - [agent_loop_max_tokens, int, false, "200000", "Input plus output tokens one tool loop step may spend"]
      - [agent_loop_max_cost, int, false, "0", "Minor-unit cost one tool loop step may spend; 0 leaves cost to the turn budget"]
      - [agent_loop_max_repeats, int, false, "3", "Identical calls of one tool before a loop is declared"]
      - [agent_loop_deadline, int, false, "300", "Wall-clock seconds one tool loop step may run"]
      - [agent_state_bucket, string, true, "", "Private bucket for turn input and conversation state; empty refuses to compose the data plane"]
      - [agent_state_max_bytes, int, true, "4194304", "Largest single state or input payload in bytes"]
      - [agent_queue_partitions, int, true, "64", "Fixed turn-queue partition pool; changing it reshuffles tenants"]
      - [agent_queue_shards, int, true, "4", "Partitions one tenant spreads over; at most agent_queue_partitions"]
      - [agent_queue_max_attempts, int, true, "5", "Deliveries of one turn before it is dead-lettered"]
      - [agent_queue_lease, int, true, "900", "Seconds one claimed turn stays leased to its worker; keep it above agent_loop_deadline"]
      - [agent_queue_batch, int, true, "8", "Turns one worker tick claims"]
      - [agent_session_cache_size, int, true, "4096", "Conversations held in the in-memory session cache"]
      - [agent_session_cache_ttl, int, true, "300", "Seconds an in-memory session snapshot lives"]
      - [agent_graph_cache_size, int, true, "1024", "Execution graphs held in the in-memory graph cache"]
      - [agent_graph_cache_ttl, int, true, "3600", "Seconds an in-memory execution graph lives"]
      - [agent_step_claim_lease, int, true, "360", "Seconds a step claim blocks other workers; keep it above agent_loop_deadline"]
      - [agent_turn_max_steps, int, true, "16", "Graph steps one turn may execute"]
      - [agent_tool_timeout, int, true, "30", "Seconds one governed tool call may run when the tool registers none"]
      - [agent_tool_max_attempts, int, true, "3", "Deliveries of one tool call when the tool registers none"]
      - [agent_guardrail_max_input_bytes, int, true, "262144", "Baseline byte ceiling on turn input, tool arguments, and retrieved content"]
      - [agent_guardrail_max_output_bytes, int, true, "1048576", "Baseline byte ceiling on model and tool output"]
      - [agent_model_region, string, true, "", "Residency region stamped on a candidate model with no route row; empty leaves it unknown"]
      - [agent_pilot_max_members, int, false, "200", "Open pilot memberships one agent may hold, which bounds what starting a conversation reads; 0 refuses every pilot add"]
      - [agent_pilot_position_timeout, int, false, "2", "Seconds one product position lookup may take while a new conversation chooses its release; 0 uses Scout's default"]
      - [agent_studio_max_agents_per_type, int, false, "20", "Agents of one type a tenant may keep, archived ones included; 0 refuses every Studio create"]
      - [agent_governance_required_fields, string, true, "", "Comma-separated Charter governance fields a release must carry; empty requires every field Charter's AgentDefinition requires, none requires none"]
      - [agent_evaluation_max_open_runs, int, true, "4", "Queued and running evaluations one agent may hold; 0 refuses every evaluation"]
      - [agent_evaluation_concurrency, int, true, "4", "Examples of one evaluation run in flight; below 2 runs them one at a time"]
      - [agent_evaluation_max_run_cost, int, true, "10000", "Minor units of agent_evaluation_currency one evaluation run may spend before it stops early"]
      - [agent_evaluation_currency, string, true, "", "ISO currency every evaluation cost is priced in; empty refuses to compose the evaluation worker"]
      - [agent_evaluation_lease, int, true, "900", "Seconds each recorded result extends an evaluation run's lease; keep it above agent_loop_deadline"]
      - [agent_evaluation_batch, int, true, "4", "Evaluation runs one worker tick claims"]
      - [agent_evaluation_max_attempts, int, true, "3", "Claims of one evaluation run before an expired lease fails it"]
      - [agent_evaluation_case_max_bytes, int, true, "32768", "Largest saved test case input or expected behavior in bytes"]
      - [agent_evaluation_max_cases, int, true, "500", "Saved test cases one golden set may hold"]
      - [agent_activation_batch, int, false, "20", "Due scheduled release activations one worker poll handles"]
      - [agent_activation_poll, int, true, "30", "Seconds between polls of the release activation worker"]
      - [agent_activation_max_attempts, int, false, "5", "Attempts of a scheduled activation that fails transiently before it is refused"]
  - table: authorization_object
    columns: [id, caption]
    rows:
      - [AGENT_STUDIO, Agent Studio]
      - [AGENT_APPROVAL, Agent approval decisions]
      - [AGENT_RESTRICTION, Agent restriction layers]
  - table: authorization_object_action
    columns: [authorization_object_id, action, caption]
    rows:
      - [AGENT_STUDIO, VIEW, View agents and drafts]
      - [AGENT_STUDIO, CREATE, Create agents of a type]
      - [AGENT_STUDIO, EDIT, "Edit, rename and reset drafts"]
      - [AGENT_STUDIO, ARCHIVE, Archive and restore agents]
      - [AGENT_STUDIO, TEST, Run draft tests]
      - [AGENT_STUDIO, PUBLISH, Publish releases and set defaults]
      - [AGENT_STUDIO, RESTORE, Restore published versions]
      - [AGENT_STUDIO, APPROVE_PUBLISH, Approve or reject another person's publish review]
      - [AGENT_APPROVAL, DECIDE, Decide assigned approval requests]
      - [AGENT_RESTRICTION, VIEW, View the platform and tenant restriction layers]
      - [AGENT_RESTRICTION, REPLACE_TENANT, Replace the tenant restriction layer]
  - table: authorization_role
    columns: [id, caption, partner_scoped]
    rows:
      - [AGENT_ADMIN, Agent Administrator, true]
      - [AGENT_OPER, Agent Operator, true]
  - table: application_menu_item
    columns: [display_order, filter_on_list, menu_id, item_id, rest_uri, caption]
    rows:
      - [260, false, setup, agent_studio, agent_studio, Agent Studio]
  - table: foreign_key_lookup
    columns: [constraint_name, lookup_style, display_column]
    rows:
      - [agent_profiles, S, "*"]
      - [agent_drafts, S, "*"]
      - [agent_aliases, D, display_name]
      - [agent_versions, S, "*"]
      - [agent_deployments, S, "*"]
      - [agent_release_activations, S, "*"]
      - [agent_studio_events, S, "*"]
      - [agent_publish_reviews, S, "*"]
      - [agent_draft_comments, S, "*"]
  - table: rest_api_header
    columns: [id, master_table]
    rows:
      - [agent_profile, agent_profile]
  - table: authorization_role_permission
    columns: [role_id, authorization_object_id, action, low_limit]
    rows:
      - [AGENT_ADMIN, AGENT_STUDIO, VIEW, "*"]
