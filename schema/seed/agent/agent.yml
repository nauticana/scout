      - [agent_default_test_task, string, true, "", "Task text a Studio draft test runs when the caller sends none; empty takes Scout's built-in sample task"]
      - [agent_review_feedback_threshold, int, true, "2", "Highest turn rating (0..5) that queues a rated turn for Studio review; 0 queues none"]
      - [agent_review_max_pending, int, true, "1000", "Pending sampled and rated turns one agent's review queue holds before new ones are skipped; 0 uses Scout's default of 1000"]
      - [agent_review_page_size, int, true, "50", "Review items one Studio page returns when the caller names no limit (0..agent_review_max_page_size); 0 uses Scout's default of 50"]
      - [agent_review_max_page_size, int, true, "200", "Largest review item page a Studio caller may ask for; 0 uses Scout's default of 200"]
      - [agent_review_max_turn_bytes, int, true, "1048576", "Bytes of a reviewed turn's input or response Studio reads or promotes; 0 uses Scout's default of 1048576"]
      - [agent_evaluation_gate_max_results, int, true, "2000", "Results of one evaluation run an evaluation gate decision may read; a larger run is refused (0..); 0 uses Scout's default of 2000"]
      - [agent_evaluation_baseline_max_bytes, int, true, "32768", "Bytes of one recorded human baseline output, at least 0; 0 uses Scout's default of 32768"]
      - [agent_evaluation_max_baselines, int, true, "20", "Human baselines one golden set version may hold, at least 0; 0 uses Scout's default of 20"]
      - [agent_evaluation_compare_page_bytes, int, true, "1048576", "Bytes of stored answers one Studio comparison page returns, at least 0; answers past it are omitted and marked; 0 uses Scout's default of 1048576"]
      - [agent_health_period, int, true, "60", "Seconds between passes of the agent health evaluator (1..86400); 0 takes 60"]
      - [agent_health_batch, int, true, "100", "Active agents one page of a health evaluator pass reads (1..10000); 0 takes 100"]
