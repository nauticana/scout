      - [agent_confirmation_lease, int, true, "60", "Seconds one MCP confirmation execution claim lasts, renewed every third of it (1..2147483647); 0 takes 60"]
      - [agent_activation_timeout, int, false, "120", "Seconds one scheduled activation's checks and swap may take; 0 uses Scout's default of 120"]
      - [agent_activation_max_lead_days, int, true, "366", "Days ahead of publication a publish may schedule its activation; 0 uses Scout's default of 366"]
      - [agent_studio_max_portable_bindings, int, true, "1024", "Bindings one portable document or template carries; 0 uses Scout's default of 1024"]
      - [agent_studio_max_references, int, true, "1024", "Reference mappings one import or template create names; 0 uses Scout's default of 1024"]
