      - [agent_versions, S, "*"]
      - [agent_deployments, S, "*"]
      - [agent_release_activations, S, "*"]
      - [agent_studio_events, S, "*"]
      - [agent_publish_reviews, S, "*"]
      - [agent_draft_comments, S, "*"]
  - table: rest_api_header
    columns: [id, master_table]
    rows:
      - [agent_profile, agent_profile]
  - table: authorization_role_permission
    columns: [role_id, authorization_object_id, action, low_limit]
    rows:
      - [AGENT_ADMIN, AGENT_STUDIO, VIEW, "*"]
      - [AGENT_ADMIN, AGENT_STUDIO, CREATE, "*"]
      - [AGENT_ADMIN, AGENT_STUDIO, EDIT, "*"]
      - [AGENT_ADMIN, AGENT_STUDIO, TEST, "*"]
      - [AGENT_ADMIN, AGENT_STUDIO, PUBLISH, "*"]
      - [AGENT_ADMIN, AGENT_STUDIO, RESTORE, "*"]
      - [AGENT_ADMIN, AGENT_STUDIO, ARCHIVE, "*"]
      - [AGENT_ADMIN, AGENT_STUDIO, APPROVE_PUBLISH, "*"]
      - [AGENT_ADMIN, AGENT_STUDIO, TEMPLATE, "*"]
