      - [agent_studio_max_template_audience, int, true, "100", "Tenants one template publication names; 0 uses Scout's default of 100"]
      - [agent_studio_usable_templates, int, true, "200", "Templates of each owner class (own, shared, platform) one template list returns; 0 uses Scout's default of 200"]
      - [agent_studio_max_governance_items, int, true, "32", "Items one Studio-authored governance list holds; 0 uses Scout's default of 32"]
      - [agent_studio_max_comments_shown, int, true, "500", "Newest draft comments one list returns; 0 uses Scout's default of 500"]
