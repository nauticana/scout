      - [agent_session_revision_memory, int, true, "4096", "Conversations whose last written revision a process remembers to discard stale cache hits; 0 uses the default 4096 (0..)"]
      - [agent_result_card_max_bytes, int, true, "65536", "Largest response in bytes copied into turn history, a larger one is referenced; 0 uses the default 65536 (0..)"]
      - [agent_run_page_max, int, true, "500", "Largest page of settled agent runs one query returns; 0 uses the default 500 (0..)"]
      - [agent_loop_max_call_revisions, int, false, "8", "Decider revisions of one proposed tool call in a turn; 0 uses the default 8 (0..)"]
      - [agent_pause_batch, int, true, "200", "Live turns one Studio pause listing asks to stop; 0 uses the default 200 (0..)"]
      - [agent_studio_report_window_days, int, true, "92", "Days one Studio usage or feedback report may span; 0 uses the default 92 (0..)"]
      - [agent_studio_usage_max_lines, int, true, "1000", "Lines one Studio usage report may return before it is refused; 0 uses the default 1000 (0..)"]
      - [agent_work_item_max_depth, int, true, "32", "Deepest delegated work item chain; 0 uses the default 32 (0..)"]
      - [agent_approval_max_candidates, int, true, "20", "Eligible holders one approver resolution considers, a count; 0 takes 20; negative is refused"]
      - [agent_approval_max_asks_per_call, int, true, "8", "Approval requests one tool call may owe, a count; 0 takes 8; negative is refused"]
      - [agent_approval_max_revised_argument_bytes, int, true, "65536", "Largest revised arguments of an edited approval verdict in bytes; 0 takes 65536; negative is refused"]
      - [agent_approval_max_routes_per_binding, int, true, "32", "Routes one approval_routing binding Studio saves, imports, or adopts may hold (1..32); 0 takes 32"]
      - [agent_approval_max_routes, int, true, "64", "Effective approval routes a published agent may hold (1..64); 0 takes 64"]
      - [agent_approval_max_route_tools, int, true, "16", "Tool patterns one approval route Studio saves, imports, or adopts may match (1..16); 0 takes 16"]
      - [agent_approval_min_route_duration, int, true, "60", "Shortest approval route deadline or extension Studio saves, imports, or adopts, in seconds (60..2592000); 0 takes 60; may only raise the floor"]
      - [agent_approval_max_route_duration, int, true, "2592000", "Longest approval route deadline or extension Studio saves, imports, or adopts, in seconds (60..2592000); 0 takes 2592000; at least agent_approval_min_route_duration"]
      - [agent_approval_max_route_window, int, true, "7776000", "Longest approval route deadline plus all its extensions Studio saves, imports, or adopts, in seconds (60..7776000); 0 takes 7776000; at least agent_approval_min_route_duration"]
