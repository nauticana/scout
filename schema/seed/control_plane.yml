      - [AGENT_ADMIN, TABLE, SELECT, prompt_baseline]
      - [AGENT_ADMIN, TABLE, SELECT, tenant_prompt_default]
      - [AGENT_ADMIN, TABLE, SELECT, agent_prompt_override]
      - [AGENT_ADMIN, TABLE, SELECT, agent_version]
      - [AGENT_ADMIN, TABLE, SELECT, agent_deployment]
      - [AGENT_ADMIN, TABLE, SELECT, agent_studio_event]
      - [AGENT_OPER, AGENT_STUDIO, VIEW, agent_studio]
      - [AGENT_OPER, PAGE, ACCESS, agent_studio]
