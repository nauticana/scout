comment: Scout control-plane constants, REST metadata, and Studio authorization
order: 20
seeds:
  - table: constant_header
    columns: [id, caption]
    rows:
      - [execution_step_kind, Execution Step Kind]
      - [model_capability, Model Capability]
      - [language_code, Language]
  - table: constant_value
    columns: [constant_id, value, caption]
    rows:
      - [execution_step_kind, model, Model Inference]
      - [execution_step_kind, tool, Governed Tool Invocation]
      - [execution_step_kind, knowledge, Knowledge Retrieval]
      - [model_capability, text, Text Generation]
      - [model_capability, image, Image Generation]
      - [model_capability, video, Video Generation]
      - [language_code, en-US, English (United States)]
      - [language_code, en-GB, English (United Kingdom)]
      - [language_code, es-ES, Spanish (Spain)]
      - [language_code, es-MX, Spanish (Mexico)]
      - [language_code, fr-FR, French (France)]
      - [language_code, de-DE, German (Germany)]
      - [language_code, it-IT, Italian (Italy)]
      - [language_code, pt-BR, Portuguese (Brazil)]
      - [language_code, nl-NL, Dutch (Netherlands)]
      - [language_code, ja-JP, Japanese (Japan)]
      - [language_code, ko-KR, Korean (Korea)]
      - [language_code, zh-CN, Chinese (Simplified)]
      - [language_code, tr-TR, Turkish (Turkey)]
  - table: constant_lookup
    columns: [constant_id, table_name, column_name]
    rows:
      - [execution_step_kind, execution_step, step_kind_code]
      - [model_capability, model_capability, capability_code]
      - [language_code, prompt_baseline, language_code]
      - [language_code, tenant_prompt_default, language_code]
      - [language_code, agent_prompt_override, language_code]
  # ISO 4217 currencies used for model pricing and tenant budgets. The exponent
  # is the currency's own minor-unit precision, not an assumed 2.
  - table: currency
    columns: [code, exponent]
    rows:
      - [USD, 2]
      - [EUR, 2]
      - [GBP, 2]
      - [CHF, 2]
      - [CAD, 2]
      - [AUD, 2]
      - [TRY, 2]
      - [CNY, 2]
      - [INR, 2]
      - [BRL, 2]
      - [JPY, 0]
      - [KRW, 0]
      - [BHD, 3]
      - [KWD, 3]
  # Lifecycle and classification catalogs. These are FK targets, so the tables
  # referencing them cannot accept a row until these exist.
  - table: turn_status
    columns: [code, is_terminal, description]
    rows:
      - [queued, false, Accepted and waiting for an executor]
      - [running, false, Executing]
      - [streaming, false, Emitting a partial response]
      - [completed, true, Finished successfully]
      - [failed, true, Finished with an error]
      - [cancelled, true, Abandoned before completion]
  - table: idempotency_status
    columns: [code, is_terminal, description]
    rows:
      - [claimed, false, Execution right acquired by one worker]
      - [committed, true, Result durably bound to the idempotency key]
      - [abandoned, true, Released unfinished so another worker may replay]
  - table: reservation_status
    columns: [code, is_terminal, description]
    rows:
      - [held, false, Budget reserved and not yet settled]
      - [settled, true, Reservation consumed by actual usage]
      - [released, true, Reservation returned unused]
      - [expired, true, Reservation lapsed before settlement]
  - table: rollout_status
    columns: [code, is_terminal, description]
    rows:
      - [pending, false, Planned but not started]
      - [active, false, Serving a traffic share]
      - [paused, false, Halted with traffic pinned]
      - [completed, true, Fully rolled out]
      - [rolled_back, true, Reverted to the previous version]
  - table: priority_class
    columns: [code, dispatch_rank, description]
    rows:
      - [interactive, 1, User is waiting on the response]
      - [standard, 2, Default background work]
      - [batch, 3, Bulk work that may wait behind other classes]
  - table: usage_category
    columns: [code, description]
    rows:
      - [model_input, Prompt tokens billed by a model]
      - [model_output, Completion tokens billed by a model]
      - [image, Generated image assets]
      - [video, Generated video seconds]
      - [tool, Governed tool invocation]
      - [knowledge, Knowledge retrieval]
  # Platform prompt sections every agent product shares. Ids are stable and
  # referenced by prompt_baseline data, so never renumber them; product-specific
  # sections take ids from 101 up.
  - table: prompt_section
    columns: [id, display_order, caption, description]
    rows:
      - [1, 1, task, Task]
      - [2, 2, tone_of_voice, Tone of voice]
      - [3, 3, brand_guidelines, Brand Guidelines]
      - [4, 4, target_audience, Target Audience]
      - [5, 5, language_style, Language Style]
      - [6, 6, location, Location]
      - [7, 7, sensitive_topics, Sensitive Topics]
      - [8, 8, prohibited_content, Prohibited Content]
      - [9, 9, escalation_policy, Escalation Policy]
  - table: model_provider
    columns: [provider_id, display_name, endpoint_uri, credential_ref, is_active]
    rows:
      - [google, Google Vertex AI / Gemini, "https://generativelanguage.googleapis.com", google_api_key, true]
      - [openai, OpenAI, "https://api.openai.com", openai_api_key, true]
      - [anthropic, Anthropic, "https://api.anthropic.com", anthropic_api_key, true]
  - table: application_config_flag
    columns: [id, data_type, needs_restart, default_value, description]
    rows:
      - [agent_max_tokens, int, false, "8192", Max output tokens per agent model completion]
      - [agent_temperature, float, false, "0.7", "Agent model sampling temperature; 0.0-2.0"]
      - [agent_run_retention_days, int, false, "0", "Days to retain agent run activity; 0 retains it forever"]
      - [agent_turn_rate, float, false, "2", Per-tenant admitted turns per second]
      - [agent_turn_burst, int, false, "10", Per-tenant turn burst]
      - [agent_tool_rate, float, false, "10", Per-tenant tool calls per second]
      - [agent_tool_burst, int, false, "20", Per-tenant tool-call burst]
      - [agent_model_rate, float, false, "2", Per-tenant model calls per second]
      - [agent_model_burst, int, false, "5", Per-tenant model-call burst]
      - [agent_fleet_turn_rate, float, false, "100", Process-wide admitted turns per second]
      - [agent_fleet_turn_burst, int, false, "200", Process-wide turn burst]
      - [agent_fleet_tool_rate, float, false, "500", Process-wide tool calls per second]
      - [agent_fleet_tool_burst, int, false, "1000", Process-wide tool-call burst]
      - [agent_fleet_model_rate, float, false, "100", Process-wide model calls per second]
      - [agent_fleet_model_burst, int, false, "200", Process-wide model-call burst]
      - [agent_max_tenants, int, false, "4096", Maximum in-memory tenant limiter entries]
      - [agent_model_capacity_pool, string, false, shared, Shared model capacity pool name]
      - [agent_model_capacity, int, false, "32", Concurrent model capacity slots]
      - [agent_model_max_waiters, int, false, "4096", Maximum queued model requests]
  - table: authorization_object
    columns: [id, caption]
    rows:
      - [AGENT_STUDIO, Agent Studio]
  - table: authorization_object_action
    columns: [authorization_object_id, action, caption]
    rows:
      - [AGENT_STUDIO, VIEW, View agents and drafts]
      - [AGENT_STUDIO, EDIT, Edit and reset drafts]
      - [AGENT_STUDIO, TEST, Run draft tests]
      - [AGENT_STUDIO, PUBLISH, Publish releases and set defaults]
      - [AGENT_STUDIO, RESTORE, Restore published versions]
  - table: authorization_role
    columns: [id, caption]
    rows:
      - [AGENT_ADMIN, Agent Administrator]
      - [AGENT_OPER, Agent Operator]
  - table: application_menu_item
    columns: [display_order, filter_on_list, menu_id, item_id, rest_uri, caption]
    rows:
      - [260, false, setup, agent_studio, agent_studio, Agent Studio]
  - table: foreign_key_lookup
    columns: [constraint_name, lookup_style, display_column]
    rows:
      - [agent_profiles, S, "*"]
      - [agent_drafts, S, "*"]
      - [agent_aliases, D, display_name]
      - [prompt_baselines, D, caption]
      - [tenant_prompt_defaults, S, "*"]
      - [agent_prompt_overrides, S, "*"]
      - [agent_versions, S, "*"]
      - [agent_deployments, S, "*"]
      - [agent_studio_events, S, "*"]
      - [agent_run_versions, S, "*"]
      - [tenant_agent_ops_events, S, "*"]
      - [model_definitions, D, display_name]
      - [model_capabilities, S, "*"]
      - [model_prices, S, "*"]
  - table: rest_api_header
    columns: [id, master_table]
    rows:
      - [agent_profile, agent_profile]
      - [model_definition, model_definition]
      - [model_capability, model_capability]
      - [prompt_section, prompt_section]
  - table: authorization_role_permission
    columns: [role_id, authorization_object_id, action, low_limit]
    rows:
      - [AGENT_ADMIN, AGENT_STUDIO, VIEW, agent_studio]
      - [AGENT_ADMIN, AGENT_STUDIO, EDIT, agent_studio]
      - [AGENT_ADMIN, AGENT_STUDIO, TEST, agent_studio]
      - [AGENT_ADMIN, AGENT_STUDIO, PUBLISH, agent_studio]
      - [AGENT_ADMIN, AGENT_STUDIO, RESTORE, agent_studio]
      - [AGENT_ADMIN, PAGE, ACCESS, agent_studio]
      - [AGENT_ADMIN, TABLE, SELECT, agent_profile]
      - [AGENT_ADMIN, TABLE, SELECT, agent_draft]
      - [AGENT_ADMIN, TABLE, SELECT, agent_alias]
      - [AGENT_ADMIN, TABLE, SELECT, model_provider]
      - [AGENT_ADMIN, TABLE, SELECT, model_definition]
      - [AGENT_ADMIN, TABLE, SELECT, model_capability]
      - [AGENT_ADMIN, TABLE, SELECT, model_price]
