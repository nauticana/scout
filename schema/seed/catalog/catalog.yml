comment: Scout catalog reference rows; every table below is an FK target
order: 10
seeds:
  - table: currency
    columns: [code, exponent]
    rows:
      - [USD, 2]
      - [EUR, 2]
      - [GBP, 2]
      - [CHF, 2]
      - [CAD, 2]
      - [AUD, 2]
      - [TRY, 2]
      - [CNY, 2]
      - [INR, 2]
      - [BRL, 2]
      - [JPY, 0]
      - [KRW, 0]
      - [BHD, 3]
      - [KWD, 3]
  # Lifecycle and classification catalogs. These are FK targets, so the tables
  # referencing them cannot accept a row until these exist.
  - table: turn_status
    columns: [code, is_terminal, description]
    rows:
      - [Q, false, Accepted and waiting for an executor]
      - [R, false, Executing]
      - [S, false, Emitting a partial response]
      - [U, false, Parked awaiting a human decision]
      - [C, true, Finished successfully]
      - [F, true, Finished with an error]
      - [X, true, Abandoned before completion]
  - table: idempotency_status
    columns: [code, is_terminal, description]
    rows:
      - [C, false, Execution right acquired by one worker]
      - [M, true, Result durably bound to the idempotency key]
      - [A, true, Released unfinished so another worker may replay]
  - table: reservation_status
    columns: [code, is_terminal, description]
    rows:
      - [H, false, Budget reserved and not yet settled]
      - [S, true, Reservation consumed by actual usage]
      - [R, true, Reservation returned unused]
      - [E, true, Reservation lapsed before settlement]
  - table: rollout_status
    columns: [code, is_terminal, description]
    rows:
      - [P, false, Planned but not started]
      - [A, false, Serving a traffic share]
      - [U, false, Halted with traffic pinned]
      - [C, true, Fully rolled out]
      - [R, true, Reverted to the previous version]
  - table: priority_class
    columns: [code, dispatch_rank, description]
    rows:
      - [I, 1, User is waiting on the response]
      - [S, 2, Default background work]
      - [B, 3, Bulk work that may wait behind other classes]
  - table: usage_category
    columns: [code, description]
    rows:
      - [model_input, Prompt tokens billed by a model]
      - [model_output, Completion tokens billed by a model]
      - [image, Generated image assets]
      - [video, Generated video seconds]
      - [tool, Governed tool invocation]
      - [knowledge, Knowledge retrieval]
      - [web_search, Provider web-search grounding]
      - [embedding, Embedding vectors generated]
  # Configuration scope and binding catalogs. Scout owns the tenant root scope
  # kind; a product seeds the levels below it. narrowing_rule names the
  # comparator service/scope applies when a child overrides a parent binding.
  - table: config_scope_kind
    columns: [code, depth_rank, description]
    rows:
      - [tenant, 0, Tenant root scope every other scope descends from]
      - [agent_type, 1, Tenant defaults shared by every agent of one type]
      - [agent, 2, One agent]
  - table: config_resource_kind
    columns: [code, narrowing_rule, description]
    rows:
      - [prompt_section, text, Prompt instruction and output for one section]
      - [policy, policy, Authorization policy statements]
      - [tool, subset, Tools an agent may invoke]
      - [knowledge, subset, Knowledge bases an agent may retrieve from]
      - [model, subset, Models an agent may route to]
      - [entitlement, subset, Retrieval entitlement labels]
      - [budget, at_most, "Token and cost ceilings per turn, rolling window, or calendar day or month"]
      - [autonomy, ordered, Operating mode an agent may act under]
      - [skill, subset, Skills an agent may use]
      - [limits, at_most, "Turn rate, step, tool-call, and duration ceilings"]
      - [approval_routing, routing, "Approval routes: who decides, by when, and how overdue work escalates"]
      - [evaluation_gate, gate, "What a draft's evaluations must show before it may be published"]
      - [health_alerts, alerts, "When an agent's production health opens an alert"]
  # Governance catalogs. audit_decision_outcome classifies every audit_event; the
  # approval catalogs order and label the work a human owes.
  - table: audit_decision_outcome
    columns: [code, is_denial, description]
    rows:
      - [A, false, Permitted and any obligations recorded]
      - [D, true, Refused by policy or authorization]
      - [P, false, Suspended awaiting a human decision]
  - table: approval_status
    columns: [code, is_terminal, description]
    rows:
      - [P, false, Waiting for a verdict]
      - [A, true, Approved as proposed]
      - [X, true, Refused]
      - [E, true, Original proposal replaced; the changed action requires a new approval]
      - [T, true, Deadline passed with no verdict]
      - [S, false, Reassigned to a backup approver]
      - [W, true, Retracted before a verdict]
  - table: mcp_confirmation_status
    columns: [code, is_open, description]
    rows:
      - [P, true, Waiting for a person to confirm]
      - [A, true, Confirmed and waiting to run]
      - [R, true, Running under a fenced lease]
      - [D, false, Ran and reported success]
      - [F, false, "Did not run, or ran and reported failure"]
      - [U, true, Outcome unknown until a person reconciles it]
      - [X, false, Refused by a person]
      - [W, false, Retracted by its maker]
      - [T, false, Not confirmed in time]
  - table: agent_state
    columns: [code, admits_work, is_terminal, description]
    rows:
      - [D, false, false, Authored but never published]
      - [A, true, false, Serving traffic]
      - [S, false, false, Stopped immediately; new work is refused]
      - [G, false, false, Finishing in-flight work only]
      - [R, false, true, Permanently withdrawn]
      - [X, false, false, "Withdrawn from use; releases, audit and conversations are kept, and it can be restored"]
  - table: approval_risk_tier
    columns: [code, severity_rank, description]
    rows:
      - [low, 1, Reversible and bounded]
      - [medium, 2, Reversible with effort]
      - [high, 3, Irreversible or externally visible]
      - [critical, 4, Irreversible with material consequence]
  - table: release_activation_state
    columns: [code, is_terminal, description]
    rows:
      - [P, false, Waiting for its effective time]
      - [A, true, Took the agent's traffic as scheduled]
      - [R, true, "Did not activate; the reason says why"]
      - [X, true, Withdrawn before it activated]
