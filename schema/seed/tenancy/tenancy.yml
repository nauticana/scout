comment: Runtime policy constants used by Scout tenancy metadata
order: 12
seeds:
  - table: constant_header
    columns: [id, caption]
    rows:
      - [capacity_class, Capacity Class]
  - table: constant_value
    columns: [constant_id, value, caption]
    rows:
      - [capacity_class, S, Shared]
      - [capacity_class, D, Dedicated]
  - table: constant_lookup
    columns: [constant_id, table_name, column_name]
    rows:
      - [capacity_class, tenant_runtime_policy, capacity_class_code]
  - table: column_display_attribute
    columns: [table_name, column_name, currency_path]
    rows:
      - [tenant_quota, cost_limit_minor_units, currency_code]
      - [tenant_runtime_policy, max_cost_minor_units, cost_currency_code]
